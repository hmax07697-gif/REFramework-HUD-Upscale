name: RE4 HUD Upscale Build

on:
  push:
    branches:
      - re4-hud-upscale
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive

      - name: Configure CMake
        run: cmake -S . -B build -G "Visual Studio 18 2026" -A x64 -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DDEVELOPER_MODE=ON "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

      - name: Build REFramework
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --target REFramework

      - name: Upload DLL artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: REFramework-HUD-Upscale-${{ github.sha }}
          path: build/bin/REFramework/dinput8.dll
          if-no-files-found: error
          retention-days: 14
